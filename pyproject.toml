[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-rt"
version = "0.1.0"
description = "Adaptive prompt-rewriting for LLM red-team research"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools]
packages = ["forge"]
include-package-data = true

[tool.setuptools.package-data]
forge = ["arsenal.json", "templates/*.html"]
